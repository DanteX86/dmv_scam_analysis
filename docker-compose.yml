version: "3.8"

services:
  dmv-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-demo-key}
      - API_SECRET_KEY=${API_SECRET_KEY:-development-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHONPATH=/app
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Redis for caching and rate limiting (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # PostgreSQL for production data storage (optional)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dmv_analysis
      POSTGRES_USER: ${POSTGRES_USER:-dmvuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmvpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
