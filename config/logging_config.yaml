---
version: 1
disable_existing_loggers: false

# Define custom formatters
formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(pathname)s:%(lineno)d - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  audit:
    format: '%(asctime)s - %(name)s - USER:%(user)s - ACTION:%(action)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  performance:
    format: '%(asctime)s - %(name)s - DURATION:%(duration).3fms - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

# Define handlers
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  app_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/app/application.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error/error.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf8

  audit_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: audit
    filename: logs/audit/audit.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf8

  performance_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: performance
    filename: logs/performance/performance.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

# Define loggers
loggers:
  app:
    level: INFO
    handlers: [console, app_file]
    propagate: no

  error:
    level: ERROR
    handlers: [error_file, console]
    propagate: no

  audit:
    level: INFO
    handlers: [audit_file]
    propagate: no

  performance:
    level: INFO
    handlers: [performance_file]
    propagate: no

  scripts:
    level: INFO
    handlers: [app_file, error_file]
    propagate: no

  analysis:
    level: INFO
    handlers: [app_file, error_file]
    propagate: no

# Root logger
root:
  level: INFO
  handlers: [console, app_file, error_file]
