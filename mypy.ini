[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
pretty = True
show_error_codes = True
show_error_context = True
color_output = True
# Ensure src/ layout is handled consistently
explicit_package_bases = True
mypy_path = src

# Don't type check caches, build artifacts, or virtual environments
exclude = (?x)(
    ^build/|
    ^dist/|
    ^.mypy_cache/|
    ^.venv/|
    ^venv/|
    ^htmlcov/|
    ^.git/|
    ^docker/|
    ^.pytest_cache/|
    ^src/dmv_scam_analysis/dashboard/|
    threat_dashboard\.py$|
    ^debug_training\.py$
    )

# Allow tests to be looser with typing
[mypy-tests.*]
ignore_errors = True

# Ignore missing types for third-party libraries commonly used here
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-cv2]
ignore_missing_imports = True

[mypy-pytesseract]
ignore_missing_imports = True

[mypy-faker]
ignore_missing_imports = True

[mypy-requests]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-psutil]
ignore_missing_imports = True

[mypy-uvicorn]
ignore_missing_imports = True

[mypy-textblob]
ignore_missing_imports = True

[mypy-nltk.*]
ignore_missing_imports = True

[mypy-behavioral_analyzer]
ignore_missing_imports = True

[mypy-ml_threat_classifier]
ignore_missing_imports = True

# Suppress errors for the dashboard module that has known formatting issues
[mypy-src.dmv_scam_analysis.dashboard.*]
ignore_errors = True
