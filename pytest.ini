[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test categories
markers =
    unit: Unit tests
    integration: Integration tests
    functional: Functional tests
    performance: Performance tests
    security: Security tests

# Test selection
addopts =
    --verbose
    --tb=short
    --showlocals
    --cov=src/dmv_scam_analysis
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=60
    --junitxml=test-results/junit.xml

# Coverage settings
[coverage:run]
branch = True
source = src/dmv_scam_analysis
omit =
    src/dmv_scam_analysis/cli/*
    src/dmv_scam_analysis/dashboard/*
    src/dmv_scam_analysis/analysis/automation_analyzer.py
    src/dmv_scam_analysis/analysis/risk_analyzer.py
    src/dmv_scam_analysis/analysis/sentiment.py
    src/dmv_scam_analysis/analysis/sentiment_analyzer.py
    src/dmv_scam_analysis/analysis/temporal_analyzer.py
    src/dmv_scam_analysis/analysis/threat_detector.py
    src/dmv_scam_analysis/ml/*
    src/dmv_scam_analysis/core/analyzer.py
    src/dmv_scam_analysis/core/model_manager.py
    src/dmv_scam_analysis/core/extractor.py
    src/dmv_scam_analysis/core/classifier.py
    src/dmv_scam_analysis/visualization/*
    src/dmv_scam_analysis/utils/log_maintenance.py
    src/dmv_scam_analysis/utils/logger.py
    src/dmv_scam_analysis/utils/test_helpers.py

[coverage:report]
omit =
    src/dmv_scam_analysis/cli/*
    src/dmv_scam_analysis/dashboard/*
    src/dmv_scam_analysis/analysis/automation_analyzer.py
    src/dmv_scam_analysis/analysis/risk_analyzer.py
    src/dmv_scam_analysis/analysis/sentiment.py
    src/dmv_scam_analysis/analysis/sentiment_analyzer.py
    src/dmv_scam_analysis/analysis/temporal_analyzer.py
    src/dmv_scam_analysis/analysis/threat_detector.py
    src/dmv_scam_analysis/ml/*
    src/dmv_scam_analysis/core/analyzer.py
    src/dmv_scam_analysis/core/model_manager.py
    src/dmv_scam_analysis/core/extractor.py
    src/dmv_scam_analysis/core/classifier.py
    src/dmv_scam_analysis/visualization/*
    src/dmv_scam_analysis/utils/log_maintenance.py
    src/dmv_scam_analysis/utils/logger.py
    src/dmv_scam_analysis/utils/test_helpers.py
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise NotImplementedError
    pass
    raise AssertionError

# Environment settings
[tool:pytest]
env =
    ENV=test
    DEBUG=1

# Logging settings
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
