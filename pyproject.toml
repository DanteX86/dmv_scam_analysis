[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/docs/conf.py
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip = ["docs/conf.py"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["numpy.typing.mypy_plugin"]
# Ensure src/ layout is handled consistently
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
    "spacy.*",
    "torch.*",
    "tensorflow.*"
]
ignore_missing_imports = true

# Relax typing for the tests package and ignore psutil missing stubs
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "psutil",
]
ignore_errors = true
ignore_missing_imports = true

[tool.bandit]
# Restrict scanning to source tree and exclude common non-source directories
exclude_dirs = [
  "tests",
  "docs",
  ".venv",
  "venv",
  "build",
  "dist",
  ".mypy_cache",
  ".pytest_cache",
  "htmlcov",
  "reports",
]
# Optional: you can also set severity/confidence thresholds via CLI if desired
